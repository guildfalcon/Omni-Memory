[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-memory"
version = "0.1.0"
description = "Production-grade, end-to-end trainable memory system based on Memory Sparse Attention (MSA). Scales to 100M tokens with <9% degradation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Omni-Memory Contributors"},
]
keywords = [
    "memory", "ai", "llm", "rag", "sparse-attention",
    "msa", "agent-memory", "persistent-memory", "kv-cache",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "accelerate>=0.25.0",
    "sentencepiece>=0.1.99",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
codex = [
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/omni-memory"
Documentation = "https://github.com/yourusername/omni-memory/tree/main/docs"
Repository = "https://github.com/yourusername/omni-memory"
Issues = "https://github.com/yourusername/omni-memory/issues"

[tool.setuptools.packages.find]
include = ["msa_memory*", "integrations*", "patches*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
